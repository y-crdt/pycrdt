name: Test stable-ABI wheels

on:
  workflow_call:
    inputs:
      release-artifacts:
        description: Test wheels already built by the publish workflow
        type: boolean
        default: false

defaults:
  run:
    shell: bash

jobs:
  build:
    if: ${{ !inputs.release-artifacts }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, macos, windows]
    runs-on: ${{ matrix.os }}-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build CPython stable-ABI wheel
        uses: PyO3/maturin-action@v1
        with:
          args: --release --features pyo3/abi3-py311 --out dist -i 3.11
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-abi3-${{ matrix.os }}
          path: dist/*.whl

  test:
    needs: build
    # Release callers supply their own artifacts, so the build job is skipped.
    if: ${{ !cancelled() && (needs.build.result == 'success' || inputs.release-artifacts) }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu
            release-artifact: wheels-linux-x86_64
          - os: macos
            release-artifact: wheels-macos
          - os: windows
            release-artifact: wheels-windows-x64
        python: ['3.11', '3.12', '3.13', '3.14', '3.15']
    runs-on: ${{ matrix.platform.os }}-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.release-artifacts && matrix.platform.release-artifact || format('wheels-abi3-{0}', matrix.platform.os) }}
          path: dist
      - name: Audit stable-ABI wheel
        run: |
          python -m pip install abi3audit
          abi3audit --strict dist/*-cp311-abi3-*.whl
      - name: Install wheel and test dependencies
        run: |
          python -m pip install "pip>=25.1"
          python -m pip install --group test
          python -m pip install --no-index --find-links dist --no-deps pycrdt
      - name: Test installed wheel
        run: python -m pytest --color=yes -v tests --ignore tests/test_types.py
