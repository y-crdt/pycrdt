name: test

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

defaults:
  run:
    shell: bash

jobs:
  abi3:
    uses: ./.github/workflows/abi3.yml

  types:
    name: Types Python ${{ matrix.python }}
    needs: abi3
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python }}
        allow-prereleases: true
    - uses: actions/download-artifact@v8
      with:
        name: wheels-abi3-ubuntu
        path: dist
    - name: Install wheel and type-check dependencies
      run: |
        python -m pip install "pip>=25.1"
        python -m pip install --group types dist/*-cp311-abi3-*.whl
    - name: Check types
      run: |
        mypy python
        python -m pytest -v tests/test_types.py

  test:
    name: Source install and coverage
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up python
      uses: actions/setup-python@v7
      with:
        python-version: '3.15'
        allow-prereleases: true

    - name: Ensure pip >= v25.1
      run: python -m pip install "pip >= 25.1"

    - name: Install rust
      uses: actions-rs/toolchain@v1
      with:
        profile: minimal
        toolchain: stable
        override: true

    - name: Cache rust
      uses: Swatinem/rust-cache@v2

    - name: Build and install pycrdt
      run: pip install -e .

    - name: Install test dependencies
      run: pip install --group test --group types -e .

    - name: Run code coverage
      run: |
        coverage run -m pytest tests
        coverage report --show-missing --fail-under=100
