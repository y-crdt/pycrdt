version: 2
updates:
- package-ecosystem: pip
  directory: "/"
  schedule:
    interval: daily
    time: "04:00"
  open-pull-requests-limit: 10
  reviewers:
  - davidbrochart
  - krassowski
- package-ecosystem: cargo
  directory: "/"
  # Cargo.lock is not tracked, so update requirements even for compatible releases.
  versioning-strategy: increase
  schedule:
    interval: daily
    time: "04:00"
  open-pull-requests-limit: 10
  reviewers:
  - davidbrochart
  - krassowski
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: "weekly"
